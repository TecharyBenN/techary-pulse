[project]
name = "techary-pulse"
version = "0.1.0"
description = "Drafts a staff newsletter from emailed updates, discusses it with reviewers and sends it once approved."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "msal>=1.39.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.50.0",
    "pyjwt[crypto]>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
pulse = "pulse.main:main"

[build-system]
requires = ["uv_build>=0.12.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pulse"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# MSAL ships without type information.
module = "msal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = [
    "live: needs the dev tenant or dev gateway",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
