[project]
name = "techary-pulse"
version = "0.1.0"
description = "Turns staff updates emailed to a shared mailbox into a weekly draft newsletter for human review."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.50.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["uv_build>=0.12.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pulse"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = [
    "live: needs the dev tenant or dev gateway",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
