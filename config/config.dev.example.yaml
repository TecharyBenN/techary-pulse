# Dev tenant example. Placeholders only: copy to config.yaml outside the
# repository and fill in the dev tenant values. config.yaml is git-ignored.
#
# The dev submissions mailbox accepts external senders, so the Techary work
# domain is allowed as a sender. Reviewers, alerts and the all-staff stand-in
# are limited to the dev tenant. Newsletters start only when a reviewer asks or
# an operator runs `pulse draft`, and are sent on approval.

graph:
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: 00000000-0000-0000-0000-000000000000
  certificate_path: /path/outside/repository/pulse-dev.pem
  max_retries: 5

mailboxes:
  submissions: pulse@devtenant.onmicrosoft.com
  conversation: pulseagent@devtenant.onmicrosoft.com
  processed_folder: Processed
  rejected_folder: Rejected

# A distribution list whose only member is the test user.
reviewers: pulse-reviewers-test@devtenant.onmicrosoft.com

all_staff: all-staff-test@devtenant.onmicrosoft.com

operator_alerts:
  - testuser@devtenant.onmicrosoft.com

allowed_sender_domains:
  - devtenant.onmicrosoft.com
  - example.org
allowed_senders: []
allowed_recipient_domains:
  - devtenant.onmicrosoft.com
allowed_sensitivity_labels: []

timezone: Europe/London

schedule:
  poll_interval_seconds: 30

send:
  mode: on_approval

orchestrator:
  max_tool_calls: 40
  max_run_minutes: 15

chat:
  port: 8080
  max_attempts: 3

# Bearer tokens for the chat endpoint. In dev, the platform's stand-in issuer
# signs them; its key set is a file on the host.
auth:
  issuer: https://identity-probe.invalid
  audience: ai-platform
  jwks: /path/to/identity-probe/jwks.json
  reviewer_role: agent.pulse

limits:
  max_words: 400

subject_template: "Pulse: {date}"

headline_title: "Headline of the week"

sections:
  - category: customer_win
    title: "Customer wins"
    definition: "A new customer has signed, or an existing customer has renewed or expanded their contract."
  - category: delivery_highlight
    title: "Delivery highlights"
    definition: "A project, service or milestone has been delivered, launched or completed for a customer."
  - category: team_news
    title: "Team news and new joiners"
    definition: "Someone has joined, moved role, gained a qualification or has a birthday, or a team has reached a milestone or held an event."
  - category: shout_out
    title: "Shout-outs"
    definition: "A named colleague is being thanked or recognised for their work."

llm:
  base_url: http://localhost:3000
  api_key_env: PULSE_LLM_API_KEY
  models:
    orchestrator: gateway-mid-model
    extractor: gateway-small-model
    consolidator: gateway-mid-model
    writer: gateway-mid-model
    judge: gateway-mid-model

state:
  db_path: ./state/pulse.db

retention_days: 90
