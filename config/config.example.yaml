# Production-shaped example. Placeholders only: copy to config.yaml outside the
# repository and fill in real values. config.yaml is git-ignored.

graph:
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: 00000000-0000-0000-0000-000000000000
  certificate_path: /run/secrets/pulse.pem
  max_retries: 5

mailboxes:
  submissions: pulse@example.org
  conversation: pulseagent@example.org
  processed_folder: Processed
  rejected_folder: Rejected

# A distribution list; the conversation mailbox accepts mail only from its members.
reviewers: pulse-reviewers@example.org

all_staff: all-staff@example.org

operator_alerts:
  - operator@example.org

allowed_sender_domains:
  - example.org
allowed_senders: []
allowed_recipient_domains:
  - example.org
allowed_sensitivity_labels:
  - 00000000-0000-0000-0000-000000000000

timezone: Europe/London

schedule:
  draft_cron: "30 17 * * FRI"
  poll_interval_seconds: 30

send:
  mode: scheduled
  day: MON
  time: "09:00"

orchestrator:
  max_tool_calls: 40
  max_run_minutes: 15

chat:
  port: 8080
  max_attempts: 3

# Bearer tokens for the chat endpoint. In production, Entra ID issues them:
# the audience is the Pulse app registration's client ID.
auth:
  issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
  audience: 11111111-1111-1111-1111-111111111111
  jwks: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/discovery/v2.0/keys
  reviewer_role: agent.pulse

limits:
  max_words: 400

subject_template: "Pulse: {date}"

headline_title: "Headline of the week"

sections:
  - category: customer_win
    title: "Customer wins"
    definition: "A new customer has signed, or an existing customer has renewed or expanded their contract."
  - category: delivery_highlight
    title: "Delivery highlights"
    definition: "A project, service or milestone has been delivered, launched or completed for a customer."
  - category: team_news
    title: "Team news and new joiners"
    definition: "Someone has joined, moved role, gained a qualification or has a birthday, or a team has reached a milestone or held an event."
  - category: shout_out
    title: "Shout-outs"
    definition: "A named colleague is being thanked or recognised for their work."

llm:
  base_url: https://gateway.example.internal
  api_key_env: PULSE_LLM_API_KEY
  models:
    orchestrator: gateway-mid-model
    extractor: gateway-small-model
    consolidator: gateway-mid-model
    writer: gateway-mid-model
    judge: gateway-mid-model

state:
  db_path: /var/lib/pulse/state/pulse.db

retention_days: 90
